openapi: 3.0.3
info:
  title: "Travora API"
  version: 1.0.0
  description: "Admin and Mobile HTTP contracts over the same Travora Core. Provider credentials, encrypted activation fields, and raw provider payloads are never returned."
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Catalog
  - name: Orders
  - name: eSIM
  - name: Wallets
  - name: Payments
  - name: Notifications
  - name: Support
  - name: Webhooks
  - name: Dashboard
  - name: Users
  - name: Providers
  - name: Audit
paths:
  /admin/audit-logs:
    get:
      operationId: AdminListAuditLogs
      tags:
        - Audit
      summary: "Admin List Audit Logs"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        401:
          "$ref": "#/components/responses/Unauthenticated"
        403:
          "$ref": "#/components/responses/Forbidden"
        422:
          "$ref": "#/components/responses/ValidationError"
      security:
        - sanctum:
            - admin
      x-permission: audit.view
      x-sanctum-ability: admin
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
  /admin/dashboard:
    get:
      operationId: AdminGetDashboard
      tags:
        - Dashboard
      summary: "Admin Get Dashboard"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        401:
          "$ref": "#/components/responses/Unauthenticated"
        403:
          "$ref": "#/components/responses/Forbidden"
        422:
          "$ref": "#/components/responses/ValidationError"
      security:
        - sanctum:
            - admin
      x-permission: dashboard.view
      x-sanctum-ability: admin
  /admin/esim/plans:
    get:
      operationId: AdminListEsimPlans
      tags:
        - eSIM
      summary: "Admin List Esim Plans"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        401:
          "$ref": "#/components/responses/Unauthenticated"
        403:
          "$ref": "#/components/responses/Forbidden"
        422:
          "$ref": "#/components/responses/ValidationError"
      security:
        - sanctum:
            - admin
      x-permission: "esim.plans.view|esim_products.view"
      x-sanctum-ability: admin
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
    post:
      operationId: AdminCreateEsimPlan
      tags:
        - eSIM
      summary: "Admin Create Esim Plan"
      responses:
        201:
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        401:
          "$ref": "#/components/responses/Unauthenticated"
        403:
          "$ref": "#/components/responses/Forbidden"
        422:
          "$ref": "#/components/responses/ValidationError"
      security:
        - sanctum:
            - admin
      x-permission: "esim.plans.manage|esim_products.create|esim_products.update"
      x-sanctum-ability: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider_id
                - name
                - validity_days
              properties:
                provider_id:
                  type: string
                  format: uuid
                name:
                  type: string
                description:
                  type: string
                data_mb:
                  type: integer
                validity_days:
                  type: integer
                is_unlimited:
                  type: boolean
                status:
                  type: string
  /admin/esim/plans/{plan}:
    get:
      operationId: AdminGetEsimPlan
      tags:
        - eSIM
      summary: "Admin Get Esim Plan"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        401:
          "$ref": "#/components/responses/Unauthenticated"
        403:
          "$ref": "#/components/responses/Forbidden"
        422:
          "$ref": "#/components/responses/ValidationError"
      security:
        - sanctum:
            - admin
      x-permission: "esim.plans.view|esim_products.view"
      x-sanctum-ability: admin
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: string
            format: uuid
    patch:
      operationId: AdminUpdateEsimPlan
      tags:
        - eSIM
      summary: "Admin Update Esim Plan"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        401:
          "$ref": "#/components/responses/Unauthenticated"
        403:
          "$ref": "#/components/responses/Forbidden"
        422:
          "$ref": "#/components/responses/ValidationError"
      security:
        - sanctum:
            - admin
      x-permission: "esim.plans.manage|esim_products.update"
      x-sanctum-ability: admin
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
  /admin/esim/plans/{plan}/countries:
    put:
      operationId: AdminSyncEsimPlanCountries
      tags:
        - eSIM
      summary: "Admin Sync Esim Plan Countries"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        401:
          "$ref": "#/components/responses/Unauthenticated"
        403:
          "$ref": "#/components/responses/Forbidden"
        422:
          "$ref": "#/components/responses/ValidationError"
      security:
        - sanctum:
            - admin
      x-permission: esim.plans.manage
      x-sanctum-ability: admin
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - country_ids
              properties:
                country_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
  /admin/esim/plans/{plan}/networks:
    put:
      operationId: AdminSyncEsimPlanNetworks
      tags:
        - eSIM
      summary: "Admin Sync Esim Plan Networks"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        401:
          "$ref": "#/components/responses/Unauthenticated"
        403:
          "$ref": "#/components/responses/Forbidden"
        422:
          "$ref": "#/components/responses/ValidationError"
      security:
        - sanctum:
            - admin
      x-permission: esim.plans.manage
      x-sanctum-ability: admin
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - network_ids
              properties:
                network_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
  /admin/esim/plans/{plan}/prices:
    get:
      operationId: AdminListEsimPlanPrices
      tags:
        - eSIM
      summary: "Admin List Esim Plan Prices"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        401:
          "$ref": "#/components/responses/Unauthenticated"
        403:
          "$ref": "#/components/responses/Forbidden"
        422:
          "$ref": "#/components/responses/ValidationError"
      security:
        - sanctum:
            - admin
      x-permission: esim.prices.view
      x-sanctum-ability: admin
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
    post:
      operationId: AdminCreateEsimPlanPrice
      tags:
        - eSIM
      summary: "Admin Create Esim Plan Price"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SuccessEnvelope"
        401:
          "$ref": "#/components/responses/Unauthenticated"
        403:
          "$ref": "#/components/responses/Forbidden"
        422:
          "$ref": "#/components/responses/ValidationError"
      security:
        - sanctum:
            - admin
      x-permission: esim.prices.manage
      x-sanctum-ability: admin
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - price_minor
                - currency
              properties:
                price_minor:
                  type: integer
                  minimum: 0
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                is_active:
                  type: boolean
  /admin/esim/prices/{price}/deactivate:
