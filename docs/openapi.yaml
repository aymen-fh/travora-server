components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: "Customer tokens have the mobile ability. Staff tokens have admin and mobile."
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          nullable: true
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    ErrorEnvelope:
      type: object
      required:
        - success
        - message
        - errors
        - code
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errors:
          type: object
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - VALIDATION_ERROR
            - NOT_FOUND
            - IDEMPOTENCY_CONFLICT
            - INSUFFICIENT_BALANCE
            - HTTP_ERROR
            - ERROR
      example:
        success: false
        message: Forbidden.
        errors: []
        code: FORBIDDEN
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currency:
          type: string
        available_balance_minor:
          type: integer
        held_balance_minor:
          type: integer
        status:
          type: string
    MaskedCredential:
      type: object
      properties:
        configured:
          type: boolean
        masked:
          type: boolean
        credential_key:
          type: string
        environment:
          type: string
        public_reference:
          type: string
      example:
        configured: true
        masked: true
        credential_key: api_token
        environment: sandbox
        public_reference: "provider:00000000-0000-0000-0000-000000000001:credential:00000000-0000-0000-0000-000000000002"
    InstallationPayload:
      type: object
      properties:
        profile_id:
          type: string
          format: uuid
        iccid:
          type: string
        smdp_address:
          type: string
        matching_id:
          type: string
        activation_code:
          type: string
        qr_payload:
          type: string
        confirmation_code_masked:
          type: string
      example:
        profile_id: 00000000-0000-0000-0000-000000000003
        iccid: 8900001234567890123
        smdp_address: smdp.example.local
        matching_id: MATCHID
        activation_code: "LPA:1$smdp.example.local$MATCHID"
        qr_payload: "LPA:1$smdp.example.local$MATCHID"
        confirmation_code_masked: "***3210"
  responses:
    Unauthenticated:
      description: "Missing or invalid Sanctum token."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: "Authenticated but missing role, permission, or token ability."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: "Request validation failed."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    IdempotencyConflict:
      description: "Idempotency-Key reused with a different payload."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
